<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --night: #141c2b;
        --foam: #dbe6ee;
        --amber: #f2b33d;
        --sea: #5fd4ad;
        --signal: #d9502f;
        --paper: #f5f1e8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--night);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--night);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="88.8"
      data-width="1920"
      data-height="1080"
    >
      <div id="open" data-composition-id="open" data-composition-src="compositions/open.html"
        data-start="0" data-duration="7" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="hero" data-composition-id="hero" data-composition-src="compositions/hero.html"
        data-start="6.4" data-duration="6.4" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="room" data-composition-id="room" data-composition-src="compositions/room.html"
        data-start="12.8" data-duration="38" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="deck" data-composition-id="deck" data-composition-src="compositions/deck.html"
        data-start="50.8" data-duration="6" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 4"></div>
      <div id="hull" data-composition-id="hull" data-composition-src="compositions/hull.html"
        data-start="56.8" data-duration="12" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 5"></div>
      <div id="revoke" data-composition-id="revoke" data-composition-src="compositions/revoke.html"
        data-start="68.8" data-duration="11" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 6"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="79.8" data-duration="9" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 7"></div>

      <!-- “Neon” by Scott Buckley, instrumental mix edited to picture. CC BY 4.0:
        https://www.scottbuckley.com.au/library/neon/ | https://creativecommons.org/licenses/by/4.0/ -->
      <audio id="music-neon" class="clip" src="assets/music/neon-watertight.mp3"
        data-start="0" data-duration="88.8" data-track-index="8" data-volume="1"></audio>

      <!-- Sound: bundled Pixabay-licensed SFX, each on a visible action. Peaks land one frame after the picture. -->
      <audio id="sfx-chips-out" class="clip" src="assets/sfx/whoosh.mp3" data-start="4.1" data-duration="0.57" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-hero-in" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="4.4" data-duration="5.5" data-track-index="11" data-volume="0.55"></audio>
      <audio id="sfx-room-whip" class="clip" src="assets/sfx/whoosh.mp3" data-start="12.67" data-duration="0.57" data-track-index="10" data-volume="0.7"></audio>
      <audio id="sfx-click-inspect" class="clip" src="assets/sfx/click.mp3" data-start="19.26" data-duration="0.36" data-track-index="12" data-volume="0.9"></audio>
      <audio id="sfx-click-sealed" class="clip" src="assets/sfx/click.mp3" data-start="24.46" data-duration="0.36" data-track-index="12" data-volume="0.9"></audio>
      <audio id="sfx-click-nrr" class="clip" src="assets/sfx/click.mp3" data-start="31.36" data-duration="0.36" data-track-index="12" data-volume="0.9"></audio>
      <audio id="sfx-pop-133" class="clip" src="assets/sfx/pop.mp3" data-start="37.6" data-duration="0.72" data-track-index="13" data-volume="0.7"></audio>
      <audio id="sfx-click-payload" class="clip" src="assets/sfx/click.mp3" data-start="40.86" data-duration="0.36" data-track-index="12" data-volume="0.9"></audio>
      <audio id="sfx-click-claims" class="clip" src="assets/sfx/click.mp3" data-start="46.16" data-duration="0.36" data-track-index="12" data-volume="0.9"></audio>
      <audio id="sfx-deck-in" class="clip" src="assets/sfx/whoosh.mp3" data-start="50.66" data-duration="0.57" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-hull-in" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="56.66" data-duration="0.57" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-pop-8of8" class="clip" src="assets/sfx/pop.mp3" data-start="62.11" data-duration="0.72" data-track-index="13" data-volume="0.75"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="68.03" data-duration="3.45" data-track-index="14" data-volume="0.45" data-fade-in="0.6"></audio>
      <audio id="sfx-click-revoke" class="clip" src="assets/sfx/click.mp3" data-start="71.36" data-duration="0.36" data-track-index="12" data-volume="0.9"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="71.41" data-duration="2.1" data-track-index="15" data-volume="0.85"></audio>
      <audio id="sfx-key-1" class="clip" src="assets/sfx/key-press.mp3" data-start="76.38" data-duration="0.2" data-track-index="16" data-volume="0.6"></audio>
      <audio id="sfx-key-2" class="clip" src="assets/sfx/key-press.mp3" data-start="76.78" data-duration="0.2" data-track-index="16" data-volume="0.6"></audio>
      <audio id="sfx-key-3" class="clip" src="assets/sfx/key-press.mp3" data-start="77.18" data-duration="0.2" data-track-index="16" data-volume="0.6"></audio>
      <audio id="sfx-end" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="81.2" data-duration="5.5" data-track-index="11" data-volume="0.5" data-fade-out="1.2"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
