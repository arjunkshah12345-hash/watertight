<template>
  <style>
    @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/InstrumentSans.woff2") format("woff2"); font-weight: 400 700; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #f1ede4; font-family: "Instrument Sans", sans-serif; }
    #room-whip { position: absolute; inset: 0; }
    #room-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
    #room-stage img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; }
    #room-s0 { opacity: 1 !important; }
    .room-mark { position: absolute; height: 3px; border-radius: 2px; transform-origin: 0 50%; }
    #room-u916 { left: 772px; top: 459px; width: 37px; background: #e0a12a; }
    #room-u131 { left: 651px; top: 481px; width: 32px; background: #d9502f; }
    #room-box133 { position: absolute; left: 1688px; top: 398px; width: 176px; height: 28px; border: 2px solid #e0a12a; border-radius: 6px; }

    .room-rail { position: absolute; top: 0; width: 760px; height: 1080px; background: #141c2b; color: #dbe6ee; overflow: hidden; }
    #room-railR { right: 0; }
    #room-railL { left: 0; }
    .room-rail .edge { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(242, 179, 61, 0.55); }
    #room-railR .edge { left: 0; }
    #room-railL .edge { right: 0; }
    .room-rail .tex { position: absolute; left: 0; bottom: 0; width: 3840px; height: 520px; background: url("assets/brand/water.png") 0 0 / 3840px 520px no-repeat; opacity: 0.22; }
    .blk { position: absolute; left: 72px; right: 64px; top: 230px; }
    .kick { font-family: "IBM Plex Mono", monospace; font-size: 28px; letter-spacing: 0.12em; text-transform: uppercase; color: #f2b33d; opacity: 0; }
    .head { margin-top: 26px; font-size: 64px; line-height: 1.05; font-weight: 500; letter-spacing: -0.022em; }
    .head .w { display: inline-block; opacity: 0; }
    .head .hl { color: #5fd4ad; }
    .head .hr { color: #e0603c; }
    .lines { margin-top: 44px; font-family: "IBM Plex Mono", monospace; font-size: 28px; line-height: 1.32; color: rgba(219, 230, 238, 0.82); }
    .lines div { opacity: 0; margin-bottom: 14px; }
    .lines b { color: #f2b33d; font-weight: 400; }
    .lines i { font-style: normal; color: #5fd4ad; }
    .lines s { color: rgba(219, 230, 238, 0.5); }

    #room-cursor { position: absolute; left: 0; top: 0; width: 46px; height: 60px; opacity: 0; }
    #room-cursor svg { width: 100%; height: 100%; display: block; }
  </style>
  <div id="root" data-composition-id="room" data-width="1920" data-height="1080">
    <div id="room-whip">
      <div id="room-stage">
        <img id="room-s0" src="assets/app/s0-start.png" alt="" />
        <img id="room-insp" src="assets/app/s0b-inspect.png" alt="" />
        <img id="room-s1" src="assets/app/s1-refused.png" alt="" />
        <img id="room-s2" src="assets/app/s2-nrr.png" alt="" />
        <img id="room-s3" src="assets/app/s3-payload.png" alt="" />
        <img id="room-s4" src="assets/app/s4-claims.png" alt="" />
        <div id="room-u916" class="room-mark"></div>
        <div id="room-u131" class="room-mark"></div>
        <div id="room-box133"></div>
      </div>
    </div>

    <div id="room-railR" class="room-rail">
      <div class="tex"></div><div class="edge"></div>
      <div class="blk" id="room-bA">
        <div class="kick">01 · The founder</div>
        <div class="head">Sealed before the model sees anything.</div>
        <div class="lines">
          <div><b>customers</b> → pseudonyms (C-07)</div>
          <div><b>people</b> → removed</div>
          <div><b>salaries</b> → department totals</div>
          <div><b>cap table</b> → share-class totals</div>
          <div><b>each deal</b> → own process, own key</div>
        </div>
      </div>
      <div class="blk" id="room-bB">
        <div class="kick">Model context</div>
        <div class="head">The model reads <span class="hl">C-07.</span> Never a name.</div>
        <div class="lines">
          <div>Anyone can open the exact redacted files the model gets.</div>
        </div>
      </div>
      <div class="blk" id="room-bE">
        <div class="kick">03 · Allowed</div>
        <div class="head">NRR is <span class="hl">91.6%.</span> The deck said <span class="hr">131%.</span></div>
        <div class="lines">
          <div><b>model</b> GLM 5.3 Flash</div>
          <div><b>via</b> api.confidential.nytokenexchange.com</div>
          <div><b>min_privacy</b> "confidential"</div>
          <div><i>no confidential route → fails closed</i></div>
        </div>
      </div>
      <div class="blk" id="room-bG">
        <div class="kick">04 · Check the deck</div>
        <div class="head">Three claims don't survive the data.</div>
        <div class="lines">
          <div><s>40+ customers</s> → <b>21</b></div>
          <div><s>$4.2M ARR</s> → <b>$3.07M</b></div>
          <div><s>131% NRR</s> → <b>91.6%</b> (GRR 82.0%)</div>
          <div>76% gross margin → <i>matches</i></div>
        </div>
      </div>
    </div>

    <div id="room-railL" class="room-rail">
      <div class="tex"></div><div class="edge"></div>
      <div class="blk" id="room-bC">
        <div class="kick">02 · Refused</div>
        <div class="head">Sealed questions stop <span class="hr">inside the room.</span></div>
        <div class="lines">
          <div><b>SEALED</b> · Customer identities</div>
          <div><i>0 bytes</i> sent to the model</div>
        </div>
      </div>
      <div class="blk" id="room-bF">
        <div class="kick">Proof</div>
        <div class="head"><span class="hl">0 of 133</span> sealed values left the room.</div>
        <div class="lines">
          <div>Every outbound payload is scanned against every sealed value.</div>
        </div>
      </div>
    </div>

    <div id="room-cursor">
      <svg viewBox="0 0 23 30"><path d="M2 1.5v23.2l5.6-5.3 3.6 8.4 3.6-1.6-3.5-8.2h7.9z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>
  </div>
  <script>
    (function () {
      var R = "";
      // per-word spans for the rail headlines
      document.querySelectorAll(R + ".head").forEach(function (el) {
        var html = "";
        el.childNodes.forEach(function (n) {
          var cls = n.nodeType === 3 ? "" : " " + n.className;
          n.textContent.split(/(\s+)/).forEach(function (p) { html += /\S/.test(p) ? '<span class="w' + cls + '">' + p + "</span>" : p; });
        });
        el.innerHTML = html;
      });

      function cam(s, ax, ay, fx, fy) {
        var x = fx - ax * s, y = fy - ay * s;
        x = Math.min(0, Math.max(1920 - 1920 * s, x));
        y = Math.min(0, Math.max(1080 - 1080 * s, y));
        return { scale: s, x: x, y: y };
      }
      function scr(c, ax, ay) { return { x: c.x + ax * c.scale, y: c.y + ay * c.scale }; }

      var FULL = cam(1, 960, 540, 960, 540);
      var VAULT = cam(2.0, 184, 380, 580, 540);
      var SEALS = cam(2.0, 184, 790, 580, 540);
      var INSP = cam(1.9, 790, 410, 580, 540);
      var INV = cam(1.25, 1128, 582, 960, 540);
      var HELD = cam(2.6, 1706, 315, 1340, 540);
      var ANS = cam(1.5, 761, 476, 580, 540);
      var EV0 = cam(2.6, 1708, 390, 1340, 540);
      var PAY = cam(1.25, 960, 540, 960, 540);
      var PAYTOP = cam(2.2, 760, 330, 960, 540);
      var INVTOP = cam(1.25, 1128, 522, 960, 540);
      var CLAIMS = cam(1.9, 681, 750, 580, 540);

      var tl = gsap.timeline({ paused: true });
      tl.set("#room-stage", FULL, 0);

      // ---- whip in from the site
      tl.fromTo("#room-whip", { x: 360, filter: "blur(18px)" }, { x: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0);

      function swap(id, t) {
        tl.set(R + "#room-stage img:not(#room-s0)", { opacity: 0 }, t);
        if (id !== "room-s0") tl.set("#" + id, { opacity: 1 }, t);
      }
      function move(c, t, d, ease) { tl.to("#room-stage", { scale: c.scale, x: c.x, y: c.y, duration: d || 0.8, ease: ease || "power3.inOut" }, t); }
      function railIn(id, t, fromLeft) {
        tl.fromTo(id, { clipPath: fromLeft ? "inset(0% 100% 0% 0%)" : "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power3.inOut" }, t);
      }
      function railOut(id, t, toLeft) {
        tl.to(id, { clipPath: toLeft ? "inset(0% 100% 0% 0%)" : "inset(0% 0% 0% 100%)", duration: 0.4, ease: "power3.in" }, t);
      }
      function blkIn(id, t) {
        tl.fromTo(id + " .kick", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, t);
        tl.fromTo(id + " .head .w", { opacity: 0, filter: "blur(7px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out", stagger: 0.07 }, t + 0.12);
        var words = document.querySelectorAll(R + id + " .head .w").length;
        tl.fromTo(id + " .lines div", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", stagger: 0.32 }, t + 0.25 + words * 0.07 + 0.25);
      }
      function blkOut(id, t) { tl.to(id, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, t); }
      function cursorTo(p, t, d) { tl.to("#room-cursor", { x: p.x, y: p.y, duration: d || 0.75, ease: "power3.inOut" }, t); }
      function press(t) { tl.to("#room-cursor", { scale: 0.86, duration: 0.07, ease: "power2.in" }, t).to("#room-cursor", { scale: 1, duration: 0.16, ease: "power2.out" }, t + 0.07); }
      function cursorShow(from, t) { tl.set("#room-cursor", { x: from.x, y: from.y, scale: 1 }, t); tl.to("#room-cursor", { opacity: 1, duration: 0.15 }, t); }
      function cursorHide(t) { tl.to("#room-cursor", { opacity: 0, duration: 0.2 }, t); }

      tl.set([".room-rail"], { clipPath: "inset(0% 0% 0% 100%)" }, 0);
      tl.set("#room-railL", { clipPath: "inset(0% 100% 0% 0%)" }, 0);
      tl.set(".blk", { opacity: 1, filter: "blur(0px)" }, 0);
      tl.set(".room-mark", { scaleX: 0 }, 0);
      tl.set("#room-box133", { opacity: 0 }, 0);
      // background texture drifts slowly under the rails
      tl.fromTo(".room-rail .tex", { x: 0 }, { x: -900, duration: 38, ease: "none" }, 0);

      // ---- 01 founder: vault, then seals
      railIn("#room-railR", 1.3);
      move(VAULT, 1.3, 1.0);
      blkIn("#room-bA", 1.65);
      move(SEALS, 3.7, 1.1, "power2.inOut");

      // ---- click "Inspect exactly what the model sees"
      var pLink = scr(SEALS, 150, 887);
      cursorShow({ x: 1000, y: 1150 }, 5.5);
      cursorTo(pLink, 5.55, 0.8);
      press(6.42);
      swap("room-insp", 6.5);
      cursorHide(6.75);
      move(INSP, 6.6, 0.75);
      blkOut("#room-bA", 6.55);
      blkIn("#room-bB", 6.85);

      // ---- 02 refusal
      railOut("#room-railR", 9.85);
      swap("room-s0", 10.0);
      move(INV, 10.0, 0.75);
      var pSealed = scr(INV, 470, 952);
      cursorShow({ x: 700, y: 1160 }, 10.55);
      cursorTo(pSealed, 10.6, 0.8);
      press(11.6);
      swap("room-s1", 11.7);
      cursorHide(12.0);
      railIn("#room-railL", 13.4, true);
      move(HELD, 13.4, 0.85);
      blkIn("#room-bC", 13.75);

      // ---- 03 allowed question
      railOut("#room-railL", 17.0, true);
      move(INV, 17.0, 0.75);
      var pNRR = scr(INV, 470, 913);
      cursorShow({ x: 800, y: 1160 }, 17.55);
      cursorTo(pNRR, 17.6, 0.8);
      press(18.5);
      swap("room-s2", 18.6);
      cursorHide(18.9);
      railIn("#room-railR", 19.3);
      move(ANS, 19.3, 0.85);
      tl.set("#room-bA, #room-bB", { opacity: 0 }, 19.0);
      blkIn("#room-bE", 19.6);
      tl.to("#room-u916", { scaleX: 1, duration: 0.35, ease: "expo.out" }, 20.5);
      tl.to("#room-u131", { scaleX: 1, duration: 0.35, ease: "expo.out" }, 21.1);

      // ---- proof: the egress entry
      railOut("#room-railR", 23.55);
      railIn("#room-railL", 23.6, true);
      tl.set("#room-bC", { opacity: 0 }, 23.4);
      move(EV0, 23.6, 0.85);
      blkIn("#room-bF", 23.95);
      tl.fromTo("#room-box133", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 24.75);

      // ---- open the exact payload
      var pPay = scr(EV0, 1590, 432);
      cursorShow({ x: 1500, y: 1150 }, 27.1);
      cursorTo(pPay, 27.15, 0.75);
      press(27.98);
      tl.set("#room-box133", { opacity: 0 }, 28.1);
      swap("room-s3", 28.1);
      cursorHide(28.3);
      railOut("#room-railL", 28.1, true);
      move(PAY, 28.1, 0.6);
      move(PAYTOP, 29.4, 1.0, "power2.inOut");

      // ---- 04 check the deck
      swap("room-s2", 31.9);
      tl.set(".room-mark", { opacity: 0 }, 23.6);
      move(INVTOP, 31.9, 0.7);
      var pClaims = scr(INVTOP, 1411, 142);
      cursorShow({ x: 1500, y: 700 }, 32.5);
      cursorTo(pClaims, 32.5, 0.75);
      press(33.28);
      swap("room-s4", 33.4);
      cursorHide(33.6);
      tl.set("#room-bE", { opacity: 0 }, 33.6);
      railIn("#room-railR", 33.9);
      move(CLAIMS, 33.9, 0.85);
      blkIn("#room-bG", 34.2);

      // ---- whip out to the site
      tl.to("#room-whip, #room-railR", { x: -340, filter: "blur(18px)", duration: 0.3, ease: "power3.in" }, 37.7);

      window.__timelines["room"] = tl;
    })();
  </script>
</template>
