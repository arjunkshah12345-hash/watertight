  <script>
    (function () {
      var R = "";
      document.querySelectorAll(R + ".head").forEach(function (el) {
        var html = "";
        el.textContent.split(/(\s+)/).forEach(function (p) { html += /\S/.test(p) ? '<span class="w">' + p + "</span>" : p; });
        el.innerHTML = html;
      });
      function cam(s, ax, ay, fx, fy) {
        var x = fx - ax * s, y = fy - ay * s;
        x = Math.min(0, Math.max(1920 - 1920 * s, x));
        y = Math.min(0, Math.max(1080 - 1080 * s, y));
        return { scale: s, x: x, y: y };
      }
      var REV = cam(2.0, 184, 840, 580, 540);
      var FULL = cam(1, 960, 540, 960, 540);
      var FLOOD = cam(2.2, 930, 560, 960, 540);
      var tl = gsap.timeline({ paused: true });
      tl.set("#rv-stage", REV, 0);
      tl.set("#rv-rail", { clipPath: "inset(0% 0% 0% 100%)" }, 0);
      tl.fromTo("#rv-wrap", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 0);
      tl.fromTo("#rv-rail", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power3.inOut" }, 0.2);
      tl.fromTo("#rv-rail .tex", { x: 0 }, { x: -260, duration: 11, ease: "none" }, 0);
      tl.fromTo("#rv-bJ .kick", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.5);
      tl.fromTo("#rv-bJ .head .w", { opacity: 0, filter: "blur(7px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out", stagger: 0.07 }, 0.62);

      // cursor to "Revoke access"

      tl.set("#rv-cursor", { x: 1050, y: 1150 }, 1.3);
      tl.to("#rv-cursor", { opacity: 1, duration: 0.15 }, 1.3);
      tl.to("#rv-cursor", { x: btn.x, y: btn.y, duration: 0.9, ease: "power3.inOut" }, 1.35);
      tl.to("#rv-cursor", { scale: 0.86, duration: 0.07, ease: "power2.in" }, 2.5).to("#rv-cursor", { scale: 1, duration: 0.16, ease: "power2.out" }, 2.57);
      // the click: everything changes at once, the investor pane floods from the bottom
      tl.set("#rv-post", { opacity: 1 }, 2.6);
      tl.set("#rv-pre-inv", { opacity: 1 }, 2.6);
      tl.fromTo("#rv-pre-inv", { clipPath: "inset(90px 420px 24px 361px)" }, { clipPath: "inset(90px 420px 990px 361px)", duration: 0.7, ease: "power3.out" }, 2.6);
      tl.set("#rv-pre", { opacity: 0 }, 2.6);
      tl.to("#rv-cursor", { opacity: 0, duration: 0.2 }, 2.8);
      tl.fromTo("#rv-bJ .lines div", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", stagger: 0.25 }, 2.75);
      tl.to("#rv-rail", { clipPath: "inset(0% 0% 0% 100%)", duration: 0.45, ease: "power3.in" }, 4.0);
      tl.to("#rv-stage", { scale: FULL.scale, x: FULL.x, y: FULL.y, duration: 0.9, ease: "power3.inOut" }, 4.1);
      tl.to("#rv-stage", { scale: FLOOD.scale, x: FLOOD.x, y: FLOOD.y, duration: 0.9, ease: "power3.inOut" }, 5.3);

      // the next question
      tl.to("#rv-dim", { opacity: 0.82, duration: 0.4, ease: "power2.inOut" }, 7.0);
      tl.to("#rv-stage", { filter: "blur(6px)", duration: 0.4, ease: "power2.inOut" }, 7.0);
      tl.fromTo("#rv-term", { opacity: 0, scale: 0.97, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, 7.1);
      tl.fromTo("#rv-code div", { opacity: 0 }, { opacity: 1, duration: 0.12, stagger: 0.12 }, 7.3);
      tl.to("#rv-wrap, #rv-term", { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, 10.75);
      window.__timelines["revoke"] = tl;
    })();
